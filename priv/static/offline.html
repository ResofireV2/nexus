<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>You're offline · Nexus</title>
  <style>
    /* Defaults are the values this page previously hardcoded, so a visitor with
       no cached appearance sees exactly what they saw before. The head script
       below overrides them from the forum's own theme when it is available. */
    :root {
      --bg: #030712;
      --s2: #0d0d14;
      --b1: #1e293b;
      --t1: #f1f5f9;
      --t5: #64748b;
      --ac: #5B4EF5;
      --ac-on: #ffffff;
      --ac-bg: rgba(91, 78, 245, 0.12);
      --ac-border: rgba(91, 78, 245, 0.25);
      --ac-text: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: var(--s2);
      border: 0.5px solid var(--b1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      font-size: 26px;
      font-weight: 600;
      color: var(--ac-text);
      font-family: Inter, sans-serif;
      flex-shrink: 0;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--ac-bg);
      border: 0.5px solid var(--ac-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .icon-wrap svg {
      width: 28px;
      height: 28px;
      stroke: var(--ac-text);
      color: var(--ac-text);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--t1);
      margin: 0 0 10px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      color: var(--t5);
      margin: 0 0 32px;
      max-width: 300px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ac);
      color: var(--ac-on);
      border: none;
      border-radius: 10px;
      padding: 11px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.1px;
      text-decoration: none;
    }

    .btn:hover { filter: brightness(0.88); }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--ac-on);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pill {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(248, 113, 113, 0.1);
      border: 0.5px solid rgba(248, 113, 113, 0.25);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: #f87171;
      font-weight: 500;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f87171;
      flex-shrink: 0;
    }
  </style>
  <script>
    // Runs in <head>, before first paint, so the page never flashes the default
    // palette before switching to the forum's own. Reads the same
    // "nexus_appearance_vars" entry the app writes on every load, which already
    // holds the resolved values for the active theme.
    (function () {
      try {
        var v = JSON.parse(localStorage.getItem("nexus_appearance_vars") || "{}") || {};
        var root = document.documentElement;
        ["--bg","--s2","--b1","--t1","--t5","--ac","--ac-on","--ac-bg","--ac-border","--ac-text"]
          .forEach(function (k) { if (v[k]) root.style.setProperty(k, v[k]); });
        if (v.theme) root.setAttribute("data-theme", v.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="logo" id="brand-logo">N</div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>No internet connection right now. Check your connection and try again.</p>

    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74"/>
        <path d="M3 3v5h5"/>
      </svg>
      Try again
    </button>

    <div class="pill">
      <div class="pill-dot"></div>
      Offline
    </div>
  </div>

  <script>
    // This page is served from Cache Storage with no network, so branding comes
    // from the same localStorage entry the app writes on every load
    // ("nexus_branding"). Same origin, so it is readable here.
    //
    // The image is fetched from Cache Storage rather than the network: the
    // service worker precaches the configured logo at install time, and the
    // worker's fetch handler only intercepts navigations, so a plain network
    // request for it would fail while offline.
    //
    // Every step degrades: cached logo, then the network copy, then the site
    // name's initial, then the built-in "N".
    (function () {
      var el = document.getElementById("brand-logo");
      if (!el) return;

      var b = {};
      try { b = JSON.parse(localStorage.getItem("nexus_branding") || "{}") || {}; } catch (e) {}

      var name = (b.site_name || "").trim();
      if (name) {
        el.textContent = name.charAt(0).toUpperCase();
        document.title = "You're offline \u00b7 " + name;
      }

      // Favicon before logo: this is a 56px square, which suits a square
      // mark better than a wide wordmark.
      var src = b.favicon_url || b.logo_url;
      if (!src) return;

      function apply(url) {
        var img = new Image();
        img.onload = function () {
          el.textContent = "";
          img.alt = name;
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "contain";
          img.style.borderRadius = "13px";
          el.appendChild(img);
        };
        // Leave whatever letter is already in place.
        img.onerror = function () {};
        img.src = url;
      }

      if (window.caches && caches.match) {
        caches.match(src).then(function (res) {
          if (!res) { apply(src); return; }
          return res.blob().then(function (blob) { apply(URL.createObjectURL(blob)); });
        }).catch(function () { apply(src); });
      } else {
        apply(src);
      }
    })();
  </script>
</body>
</html>
